services:
  auth-central:
    image: ghcr.io/francocsanchez/auth-central:latest
    container_name: auth-central
    restart: unless-stopped
    ports:
      - "32770:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      ALLOWED_RETURN_TO_ORIGINS: ${ALLOWED_RETURN_TO_ORIGINS:-}
      BOOTSTRAP_ON_STARTUP: ${BOOTSTRAP_ON_STARTUP:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Auth Central Admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe12345!}
      BOOTSTRAP_INTRANIC_NAME: ${BOOTSTRAP_INTRANIC_NAME:-IntraNIC}
      BOOTSTRAP_NFC_NAME: ${BOOTSTRAP_NFC_NAME:-NFC}
